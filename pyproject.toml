[project]
name = "proof-engine"
version = "0.2.0"
description = "One-factor Monte Carlo comparison of a down-only (ratchet) mortgage with a standard fixed-rate mortgage under modeled refinancing behavior."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
notebook = ["jupyter", "matplotlib"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proof_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
